name: Docker Build for Different Environments

on:
  push:
    branches:
      - dev
      - qa
      - main  # Assuming 'main' is used for prod

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set Docker image tag based on branch
      id: set_tag
      run: |
        if [[ $GITHUB_REF == 'refs/heads/dev' ]]; then
          echo "IMAGE_TAG=dev" >> $GITHUB_ENV
          echo "POSTGRES_DB=$POSTGRES_DB" >> $GITHUB_ENV
          echo "POSTGRES_USER=$POSTGRES_USER" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> $GITHUB_ENV
          echo "POSTGRES_PORT=$POSTGRES_PORT" >> $GITHUB_ENV
          echo "PGADMIN_DEFAULT_EMAIL=$PGADMIN_DEFAULT_EMAIL" >> $GITHUB_ENV
          echo "PGADMIN_DEFAULT_PASSWORD=$PGADMIN_DEFAULT_PASSWORD" >> $GITHUB_ENV
          echo "PGADMIN_PORT=$PGADMIN_PORT" >> $GITHUB_ENV
          echo "NEO4J_USER=$NEO4J_USER" >> $GITHUB_ENV
          echo "NEO4J_PASSWORD=$NEO4J_PASSWORD" >> $GITHUB_ENV
          echo "NEO4J_HTTP_PORT=$NEO4J_HTTP_PORT" >> $GITHUB_ENV
          echo "NEO4J_BOLT_PORT=$NEO4J_BOLT_PORT" >> $GITHUB_ENV
          echo "DOCKER_IMAGE=$DOCKER_IMAGE" >> $GITHUB_ENV
          echo "CONTAINER_NAME=$CONTAINER_NAME" >> $GITHUB_ENV
          echo "API_PORT=$API_PORT" >> $GITHUB_ENV
          echo "DATABASE_URL=$DATABASE_URL" >> $GITHUB_ENV
        elif [[ "$GITHUB_REF" == "refs/heads/qa" ]]; then
          echo "IMAGE_TAG=qa" >> $GITHUB_ENV
        elif [[ $GITHUB_REF == 'refs/heads/main' ]]; then
          echo "IMAGE_TAG=prod" >> $GITHUB_ENV
        fi
      env:
        POSTGRES_DB: ${{ secrets.POSTGRES_DB_dev }}
        POSTGRES_USER: ${{ secrets.POSTGRES_USER_dev }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_dev }}
        POSTGRES_PORT: ${{ secrets.POSTGRES_PORT_dev }}
        PGADMIN_DEFAULT_EMAIL: ${{ secrets.PGADMIN_DEFAULT_EMAIL_dev }}
        PGADMIN_DEFAULT_PASSWORD: ${{ secrets.PGADMIN_DEFAULT_PASSWORD_dev }}
        PGADMIN_PORT: ${{ secrets.PGADMIN_PORT_dev }}
        NEO4J_USER: ${{ secrets.NEO4J_USER_dev }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD_dev }}
        NEO4J_HTTP_PORT: ${{ secrets.NEO4J_HTTP_PORT_dev }}
        NEO4J_BOLT_PORT: ${{ secrets.NEO4J_BOLT_PORT_dev }}
        DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE_dev }}
        CONTAINER_NAME: ${{ secrets.CONTAINER_NAME_dev }}
        API_PORT: ${{ secrets.API_PORT_dev }}
        DATABASE_URL: ${{ secrets.DATABASE_URL_dev }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v2
      with:
        context: .  # Use the current directory as the build context
        push: true  # Push the image to Docker Hub after building
        tags: tgonz67/theoforge-backend:${{ env.IMAGE_TAG }}  # Use the appropriate Docker image and tag
        build-args: |
          POSTGRES_DB=${{ env.POSTGRES_DB }}
          POSTGRES_USER=${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}
          POSTGRES_PORT=${{ env.POSTGRES_PORT }}
          PGADMIN_DEFAULT_EMAIL=${{ env.PGADMIN_DEFAULT_EMAIL }}
          PGADMIN_DEFAULT_PASSWORD=${{ env.PGADMIN_DEFAULT_PASSWORD }}
          PGADMIN_PORT=${{ env.PGADMIN_PORT }}
          NEO4J_USER=${{ env.NEO4J_USER }}
          NEO4J_PASSWORD=${{ env.NEO4J_PASSWORD }}
          NEO4J_HTTP_PORT=${{ env.NEO4J_HTTP_PORT }}
          NEO4J_BOLT_PORT=${{ env.NEO4J_BOLT_PORT }}
          DOCKER_IMAGE=${{ env.DOCKER_IMAGE }}
          CONTAINER_NAME=${{ env.CONTAINER_NAME }}
          API_PORT=${{ env.API_PORT }}
          DATABASE_URL=${{ env.DATABASE_URL }}