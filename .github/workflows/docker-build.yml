name: Docker Build for Different Environments

on:
  push:
    branches:
      - dev
      - qa
      - main  # Assuming 'main' is used for prod

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set Docker image tag based on branch
      id: set_tag
      run: |
        if [[ $GITHUB_REF == 'refs/heads/dev' ]]; then
          echo "IMAGE_TAG=dev" >> $GITHUB_ENV
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER_dev }}" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD_dev }}" >> $GITHUB_ENV
          echo "POSTGRES_PORT=${{ secrets.POSTGRES_PORT_dev }}" >> $GITHUB_ENV
          echo "PGADMIN_DEFAULT_EMAIL=${{ secrets.PGADMIN_DEFAULT_EMAIL_dev }}" >> $GITHUB_ENV
          echo "PGADMIN_DEFAULT_PASSWORD=${{ secrets.PGADMIN_DEFAULT_PASSWORD_dev }}" >> $GITHUB_ENV
          echo "PGADMIN_PORT=${{ secrets.PGADMIN_PORT_dev }}" >> $GITHUB_ENV
          echo "NEO4J_USER=${{ secrets.NEO4J_USER_dev }}" >> $GITHUB_ENV
          echo "NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD_dev }}" >> $GITHUB_ENV
          echo "NEO4J_HTTP_PORT=${{ secrets.NEO4J_HTTP_PORT_dev }}" >> $GITHUB_ENV
          echo "NEO4J_BOLT_PORT=${{ secrets.NEO4J_BOLT_PORT_dev }}" >> $GITHUB_ENV
          echo "API_PORT=${{ secrets.API_PORT_dev }}" >> $GITHUB_ENV
          echo "DATABASE_URL=${{ secrets.DATABASE_URL_dev }}" >> $GITHUB_ENV
        elif [[ $GITHUB_REF == 'refs/heads/qa' ]]; then
          echo "IMAGE_TAG=qa" >> $GITHUB_ENV
        elif [[ $GITHUB_REF == 'refs/heads/main' ]]; then
          echo "IMAGE_TAG=prod" >> $GITHUB_ENV
        fi

    - name: Build and push Docker image
      uses: docker/build-push-action@v2
      with:
        context: .  # Use the current directory as the build context
        push: true  # Push the image to Docker Hub after building
        tags: tgonz67/theoforge-backend:${{ env.IMAGE_TAG }}  # Use the appropriate Docker image and tag
        build-args: |
          POSTGRES_USER=${{ POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ POSTGRES_PASSWORD }}
          POSTGRES_PORT=${{ POSTGRES_PORT }}
          PGADMIN_DEFAULT_EMAIL=${{ PGADMIN_DEFAULT_EMAIL}}
          PGADMIN_DEFAULT_PASSWORD=${{ PGADMIN_DEFAULT_PASSWORD }}
          PGADMIN_PORT=${{ PGADMIN_PORT }}
          NEO4J_USER=${{ NEO4J_USER }}
          NEO4J_PASSWORD=${{ NEO4J_PASSWORD }}
          NEO4J_HTTP_PORT=${{ NEO4J_HTTP_PORT }}
          NEO4J_BOLT_PORT=${{ NEO4J_BOLT_PORT }}
          API_PORT=${{ API_PORT }}
          DATABASE_URL=${{ DATABASE_URL }}