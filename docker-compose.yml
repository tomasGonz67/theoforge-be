version: '3.8'

services:
  postgres:
    image: postgres:16.2
    environment:
      POSTGRES_DB: theoforge_dev
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d theoforge_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network


  theoForgeAPI:
    image: tgonz67/theoforge-backend:dev
    container_name: theoForgeDevAPI
    pull_policy: always
    restart: always
    volumes:
      - ./alembic:/app/alembic
      - ./tests:/app/tests
      - ./settings:/app/settings
      - ./alembic.ini:/app/alembic.ini
      - ./pytest.ini:/app/pytest.ini
      - ./requirements.txt:/app/requirements.txt
    depends_on:
      postgres:
        condition: service_healthy
    networks:
       - traefik
       - backend
       - app-network
    ports:
      - "8003:8000"
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.api.rule=(Host(`dev.theoforge.com`) || Host(`www.dev.theoforge.com`)) && PathPrefix(`/API`)
      - traefik.http.routers.api.entrypoints=https
      - traefik.http.routers.api.tls=true
      - traefik.http.routers.api.tls.certresolver=simple-resolver
      - traefik.http.middlewares.api-strip.stripprefix.prefixes=/API
      - traefik.http.routers.api.middlewares=api-strip
      - traefik.http.services.api.loadbalancer.server.port=8000

    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@postgres:5432/theoforge_dev

volumes:
  postgres-data:
  pgadmin-data:

networks:
  app-network:
    driver: bridge
  traefik:
      name: traefik
      external: true
  backend:
      external: true