name: Docker Build for Different Environments

on:
  push:
    branches:
      - dev
      - qa
      - main  # Assuming 'main' is used for prod

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set Docker image tag based on branch
      id: set_tag
      run: |
        if [[ $GITHUB_REF == 'refs/heads/dev' ]]; then
          echo "IMAGE_TAG=dev" >> $GITHUB_ENV
          echo "ENV_SUFFIX=_DEV" >> $GITHUB_ENV
        elif [[ "$GITHUB_REF" == "refs/heads/qa" ]]; then
          echo "IMAGE_TAG=qa" >> $GITHUB_ENV
          echo "ENV_SUFFIX=_QA" >> $GITHUB_ENV
        elif [[ $GITHUB_REF == 'refs/heads/main' ]]; then
          echo "IMAGE_TAG=prod" >> $GITHUB_ENV
          echo "ENV_SUFFIX=_PROD" >> $GITHUB_ENV
        fi

    - name: Build and push Docker image (without secrets)
      uses: docker/build-push-action@v2
      with:
        context: .
        push: true
        tags: tgonz67/theoforge-backend:${{ env.IMAGE_TAG }}
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new

    # Move cache
    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

    # Create .env file to use with docker-compose on remote server
    - name: Create environment file
      run: |
        cat > .env << EOL
        # Automatically determined tag
        IMAGE_TAG=${{ env.IMAGE_TAG }}
        
        # Environment variables from secrets
        POSTGRES_DB=${{ secrets[format('POSTGRES_DB{0}', env.ENV_SUFFIX)] }}
        POSTGRES_USER=${{ secrets[format('POSTGRES_USER{0}', env.ENV_SUFFIX)] }}
        POSTGRES_PASSWORD=${{ secrets[format('POSTGRES_PASSWORD{0}', env.ENV_SUFFIX)] }}
        POSTGRES_PORT=${{ secrets[format('POSTGRES_PORT{0}', env.ENV_SUFFIX)] }}
        PGADMIN_DEFAULT_EMAIL=${{ secrets[format('PGADMIN_DEFAULT_EMAIL{0}', env.ENV_SUFFIX)] }}
        PGADMIN_DEFAULT_PASSWORD=${{ secrets[format('PGADMIN_DEFAULT_PASSWORD{0}', env.ENV_SUFFIX)] }}
        PGADMIN_PORT=${{ secrets[format('PGADMIN_PORT{0}', env.ENV_SUFFIX)] }}
        NEO4J_USER=${{ secrets[format('NEO4J_USER{0}', env.ENV_SUFFIX)] }}
        NEO4J_PASSWORD=${{ secrets[format('NEO4J_PASSWORD{0}', env.ENV_SUFFIX)] }}
        NEO4J_HTTP_PORT=${{ secrets[format('NEO4J_HTTP_PORT{0}', env.ENV_SUFFIX)] }}
        NEO4J_BOLT_PORT=${{ secrets[format('NEO4J_BOLT_PORT{0}', env.ENV_SUFFIX)] }}
        DOCKER_IMAGE=tgonz67/theoforge-backend:${{ env.IMAGE_TAG }}
        CONTAINER_NAME=${{ secrets[format('CONTAINER_NAME{0}', env.ENV_SUFFIX)] }}
        API_PORT=${{ secrets[format('API_PORT{0}', env.ENV_SUFFIX)] }}
        DATABASE_URL=${{ secrets[format('DATABASE_URL{0}', env.ENV_SUFFIX)] }}
        EOL

    # Deploy to server with SSH
    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets[format('SERVER_HOST{0}', env.ENV_SUFFIX)] }}
        username: ${{ secrets[format('SERVER_USER{0}', env.ENV_SUFFIX)] }}
        key: ${{ secrets[format('SSH_PRIVATE_KEY{0}', env.ENV_SUFFIX)] }}
        script: |
          cd /path/to/deployment
          docker pull tgonz67/theoforge-backend:${{ env.IMAGE_TAG }}