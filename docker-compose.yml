version: '3.8'
  
  services:
    postgres:
      image: postgres:16.2
      environment:
        POSTGRES_DB: theoforge_dev
        POSTGRES_USER: user
        POSTGRES_PASSWORD: password
      volumes:
        - postgres-data:/var/lib/postgresql/data
      ports:
        - "5432:5432"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U user -d theoforge_dev"]
        interval: 10s
        timeout: 5s
        retries: 5
      networks:
        - app-network
  
    pgadmin:
      image: dpage/pgadmin4
      environment:
        PGADMIN_DEFAULT_EMAIL: admin@example.com
        PGADMIN_DEFAULT_PASSWORD: adminpassword
        PGADMIN_LISTEN_PORT: 80
      ports:
        - "5050:80"
      volumes:
        - pgadmin-data:/var/lib/pgadmin
      depends_on:
        postgres:
          condition: service_healthy
      networks:
        - app-network
  
    neo4j:
      image: neo4j:5.18.0
      environment:
        NEO4J_AUTH: neo4j/password
        NEO4J_ACCEPT_LICENSE_AGREEMENT: 'yes'
        #NEO4J_dbms_security_allow__csv__import__from__file__urls: 'true'
        NEO4J_PLUGINS: '["graph-data-science"]' # Use correct GDS plugin name
        NEO4J_dbms_security_procedures_unrestricted: 'gds.*' # Allow all GDS procedures/functions
      ports:
        - "7474:7474"  # HTTP
        - "7687:7687"  # Bolt protocol
      volumes:
        - neo4j-data:/data
      networks:
        - app-network
      healthcheck:
        test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 5
  
    qdrant:
      image: qdrant/qdrant:v1.7.4
      ports:
        - "6333:6333"  # HTTP
        - "6334:6334"  # GRPC
      volumes:
        - qdrant-data:/qdrant/storage
      environment:
        - QDRANT_ALLOW_RECOVERY_MODE=true
        - QDRANT_TELEMETRY_DISABLED=true
        - QDRANT_LOG_LEVEL=INFO
      restart: unless-stopped
      networks:
        - app-network
      healthcheck:
        test: ["CMD", "wget", "-O", "/dev/null", "-q", "http://localhost:6333/healthz"]
        interval: 10s
        timeout: 5s
        retries: 3
        start_period: 20s
  
    api:
      build: .
      env_file:
        - .env
      ports:
        - "8000:8000"
      volumes:
        - ./app:/app/app
        - ./alembic:/app/alembic
        - ./tests:/app/tests
        - ./settings:/app/settings
        - ./alembic.ini:/app/alembic.ini
        - ./pytest.ini:/app/pytest.ini
        - ./requirements.txt:/app/requirements.txt
        # Mount the text_to_cleaning sub-package to the correct path within the container's app package
        - ./app/text-to-cleaning:/app/app/text-to-cleaning
      depends_on:
        postgres:
          condition: service_healthy
        minio:
          condition: service_healthy
        neo4j: # Add dependency on neo4j
          condition: service_healthy
      networks:
        - app-network
      environment:
        - DATABASE_URL=postgresql+asyncpg://user:password@postgres:5432/theoforge_dev
        - PYTHONPATH=/app
        - NEO4J_URI=bolt://neo4j:7687
        - NEO4J_USER=neo4j
        - NEO4J_PASSWORD=password
        - MINIO_ENDPOINT=http://minio:9000
        - MINIO_ACCESS_KEY=minioadmin
        - MINIO_SECRET_KEY=minioadmin
        - MINIO_BUCKET_NAME=resources
        - QDRANT_URL=http://qdrant:6333
        - QDRANT_COLLECTION=theoforge_vectors
        - VECTOR_DIMENSION=1536
      restart: unless-stopped
  
    minio:
      image: quay.io/minio/minio
      container_name: minio_server
      restart: always
      ports:
        - "9000:9000"  # MinIO API
        - "9090:9090"  # MinIO Console
      environment:
        MINIO_ROOT_USER: minioadmin
        MINIO_ROOT_PASSWORD: minioadmin
      command: server /data --console-address ":9090"
      volumes:
        - minio-data:/data
      networks:
        - app-network
      healthcheck:
        test: ["CMD", "curl", "-f", "http://minio:9000/minio/health/live"]
        interval: 10s
        timeout: 5s
        retries: 5
  
  volumes:
    postgres-data:
    pgadmin-data:
    neo4j-data:
    minio-data:
    qdrant-data:
  
  networks:
    app-network:
      driver: bridge
